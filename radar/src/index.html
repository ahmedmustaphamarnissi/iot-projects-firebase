<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ESP32 Radar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #091215;
        --surface: #0f1c20;
        --surface-2: #14262b;
        --line: #213439;
        --text: #e7f2f1;
        --muted: #7f9a9d;
        --mint: #5eead4;
        --green: #4ade80;
        --red: #ff5d62;
        --amber: #fbbf24;
        --font-display: "Sora", "DM Sans", system-ui, sans-serif;
        --font-body:
          "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }

      main {
        flex: 1;
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 20px 24px;
      }

      :focus-visible {
        outline: 3px solid var(--mint);
        outline-offset: 3px;
      }

      svg.icon {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      /* ---------- Buttons ---------- */
      .btn {
        font: inherit;
        font-weight: 700;
        font-size: 0.95rem;
        border: 1.5px solid transparent;
        border-radius: 12px;
        padding: 12px 20px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        width: 100%;
        background: var(--mint);
        color: #05201c;
        font-size: 1rem;
        padding: 15px 20px;
      }
      .btn-primary:hover {
        background: #8af3e2;
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .btn-outline {
        background: transparent;
        color: var(--text);
        border-color: var(--line);
      }
      .btn-outline:hover {
        border-color: var(--mint);
        color: var(--mint);
      }

      /* ---------- Login ---------- */
      #loginForm {
        max-width: 420px;
        margin: 9vh auto 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 26px;
        padding: 36px 30px 30px;
      }
      .brand-chip {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        margin-bottom: 22px;
        color: var(--mint);
        background: rgba(94, 234, 212, 0.1);
        border: 1px solid rgba(94, 234, 212, 0.35);
        border-radius: 50%;
      }
      .brand-chip svg {
        width: 28px;
        height: 28px;
      }
      #loginForm h1 {
        margin: 0 0 8px;
        font-family: var(--font-display);
        font-size: 1.9rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      #loginForm .lead {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.5;
      }
      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        margin-bottom: 7px;
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--muted);
      }
      .field input {
        width: 100%;
        padding: 14px 16px;
        font: inherit;
        font-size: 1rem;
        color: var(--text);
        background: var(--bg);
        border: 1.5px solid var(--line);
        border-radius: 12px;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .field input::placeholder {
        color: #4d6669;
      }
      .field input:focus {
        outline: none;
        border-color: var(--mint);
        box-shadow: 0 0 0 4px rgba(94, 234, 212, 0.15);
      }
      #loginError {
        min-height: 1.3em;
        margin: -4px 0 14px;
        font-size: 0.9rem;
        color: var(--red);
        font-weight: 600;
      }

      /* ---------- Dashboard ---------- */
      #dashboard {
        display: none;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 26px;
      }
      .title-block {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .title-block .brand-chip {
        width: 48px;
        height: 48px;
        margin: 0;
      }
      .title-block .brand-chip svg {
        width: 24px;
        height: 24px;
      }
      .title-block h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(1.5rem, 4vw, 1.9rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      .conn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 4px;
        font-size: 0.88rem;
        font-weight: 500;
        color: var(--muted);
      }
      .conn .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--red);
      }
      .conn.online .dot {
        background: var(--green);
        box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.18);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 22px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ---------- Radar ---------- */
      .radar-card {
        display: flex;
        flex-direction: column;
      }
      .radar-wrap {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 6px 0 0;
      }
      #radarSvg {
        width: 100%;
        height: auto;
        max-height: 360px;
        overflow: visible;
      }
      .ring {
        fill: none;
        stroke: var(--line);
        stroke-width: 1.5;
      }
      .axis {
        stroke: var(--line);
        stroke-width: 1.5;
      }
      .svg-label {
        fill: var(--muted);
        font-size: 12px;
        font-family: var(--font-body);
        text-anchor: middle;
      }
      .needle {
        transform-origin: 200px 210px;
        transition: transform 0.6s cubic-bezier(0.3, 0.9, 0.3, 1);
      }
      .needle.scanning {
        transition: none;
        animation: sweep 3.4s ease-in-out infinite alternate;
      }
      .wedge {
        fill: var(--mint);
        opacity: 0.17;
      }
      .needle-line {
        stroke: var(--mint);
        stroke-width: 3;
        stroke-linecap: round;
        transition: stroke 0.3s ease;
      }
      .hub {
        fill: var(--mint);
        transition: fill 0.3s ease;
      }
      #radarSvg.alert .needle-line {
        stroke: var(--red);
      }
      #radarSvg.alert .wedge,
      #radarSvg.alert .hub {
        fill: var(--red);
      }
      .blip-pulse {
        fill: var(--red);
        opacity: 0.35;
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 1.6s ease-out infinite;
      }
      .blip-dot {
        fill: var(--red);
      }
      @keyframes sweep {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(180deg);
        }
      }
      @keyframes pulse {
        from {
          transform: scale(0.6);
          opacity: 0.5;
        }
        to {
          transform: scale(2.6);
          opacity: 0;
        }
      }

      .radar-foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
      }
      .k {
        display: block;
        margin-bottom: 4px;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
      }
      #angleReadout {
        font-family: var(--font-display);
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .mode-badge {
        padding: 7px 14px;
        font-size: 0.85rem;
        font-weight: 700;
        border-radius: 999px;
        color: var(--muted);
        border: 1px solid var(--line);
      }
      .mode-badge.auto {
        color: var(--mint);
        border-color: rgba(94, 234, 212, 0.45);
        background: rgba(94, 234, 212, 0.08);
      }

      /* ---------- Detection ---------- */
      .detect {
        transition:
          border-color 0.3s ease,
          background-color 0.3s ease;
        min-height: 210px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .detect.clear {
        border-color: rgba(74, 222, 128, 0.4);
        background: linear-gradient(
          160deg,
          rgba(74, 222, 128, 0.1),
          var(--surface) 60%
        );
      }
      .detect.alert {
        border-color: rgba(255, 93, 98, 0.6);
        background: linear-gradient(
          160deg,
          rgba(255, 93, 98, 0.16),
          var(--surface) 60%
        );
      }
      .detect-head {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        color: var(--muted);
      }
      .detect-head .chip {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--surface-2);
        color: var(--text);
      }
      .detect.clear .chip {
        color: var(--green);
      }
      .detect.alert .chip {
        color: var(--red);
      }
      .detect-state {
        margin: 20px 0 6px;
        font-family: var(--font-display);
        font-size: 1.7rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .distance {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-family: var(--font-display);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .distance #distVal {
        font-size: clamp(3.6rem, 10vw, 4.8rem);
        color: var(--red);
      }
      .distance .u {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: -0.02em;
      }
      .detect-sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- Indicators ---------- */
      .indicators {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .ind {
        --c: var(--green);
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        transition:
          border-color 0.3s ease,
          background-color 0.3s ease;
      }
      .ind.on {
        border-color: color-mix(in srgb, var(--c) 65%, transparent);
        background: color-mix(in srgb, var(--c) 10%, var(--surface));
      }
      .ind-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        transition: color 0.3s ease;
      }
      .ind.on .ind-top {
        color: var(--c);
      }
      .ind .led {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #2a3d42;
        transition:
          background-color 0.3s ease,
          box-shadow 0.3s ease;
      }
      .ind.on .led {
        background: var(--c);
        box-shadow:
          0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent),
          0 0 12px var(--c);
      }
      .ind-name {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .ind-state {
        display: block;
        margin-top: 2px;
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text);
      }
      @keyframes buzz {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-1.5px);
        }
        75% {
          transform: translateX(1.5px);
        }
      }
      .ind.buzzer.on svg {
        animation: buzz 0.18s linear infinite;
      }

      /* ---------- Controls ---------- */
      .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .control-row .info {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .control-row .chip {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: var(--surface-2);
        color: var(--mint);
      }
      .control-row h2,
      .angle-head h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .control-row p {
        margin: 3px 0 0;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .switch {
        position: relative;
        flex-shrink: 0;
        width: 60px;
        height: 34px;
        padding: 0;
        border: none;
        border-radius: 999px;
        background: #2a3d42;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.3s cubic-bezier(0.3, 1.4, 0.5, 1);
      }
      .switch[aria-checked="true"] {
        background: var(--mint);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(26px);
      }
      .switch:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .divider {
        height: 1px;
        background: var(--line);
        margin: 22px 0;
      }

      .angle-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .angle-head .val {
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--mint);
      }
      .angle-block {
        transition: opacity 0.3s ease;
      }
      .angle-block.locked {
        opacity: 0.4;
      }
      .angle-block.locked .range-wrap,
      .angle-block.locked .presets {
        pointer-events: none;
      }
      .lock-note {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 6px;
        font-size: 0.88rem;
        color: var(--amber);
      }
      .lock-note svg {
        width: 16px;
        height: 16px;
      }

      /* Range slider, like a shop price filter */
      .range-wrap {
        --pn: 0;
        position: relative;
        padding-top: 46px;
      }
      .bubble {
        position: absolute;
        top: 4px;
        left: calc(var(--pn) * 1% + (13px - var(--pn) * 0.26px));
        transform: translateX(-50%);
        padding: 5px 11px;
        font-size: 0.85rem;
        font-weight: 700;
        color: #05201c;
        background: var(--mint);
        border-radius: 999px;
        white-space: nowrap;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        margin: 0;
        border-radius: 999px;
        outline: none;
        cursor: pointer;
        background: linear-gradient(
          to right,
          var(--mint) calc(var(--pn) * 1%),
          #263a40 calc(var(--pn) * 1%)
        );
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--bg);
        border: 4px solid var(--mint);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--bg);
        border: 4px solid var(--mint);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      input[type="range"]:focus-visible {
        outline: 3px solid var(--mint);
        outline-offset: 8px;
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .presets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 18px;
      }
      .preset {
        font: inherit;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.05rem;
        padding: 14px 10px;
        color: var(--text);
        background: var(--surface-2);
        border: 1.5px solid var(--line);
        border-radius: 14px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          border-color 0.2s ease,
          background-color 0.2s ease,
          color 0.2s ease;
      }
      .preset:hover {
        border-color: var(--mint);
      }
      .preset:active {
        transform: scale(0.97);
      }
      .preset.active {
        color: #05201c;
        background: var(--mint);
        border-color: var(--mint);
      }

      footer {
        padding: 22px;
        text-align: center;
        font-size: 0.88rem;
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 560px) {
        main {
          padding-top: 20px;
        }
        #loginForm {
          margin-top: 5vh;
          padding: 28px 22px 24px;
        }
        .card {
          padding: 18px;
          border-radius: 20px;
        }
        .actions {
          width: 100%;
        }
        .actions .btn {
          width: 100%;
        }
        .indicators {
          gap: 8px;
        }
        .ind {
          padding: 12px;
        }
        .ind-state {
          font-size: 1rem;
        }
        .control-row .info p {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Login form -->
      <section id="loginForm" aria-labelledby="loginTitle">
        <div class="brand-chip" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="6" />
            <circle cx="12" cy="12" r="2" />
          </svg>
        </div>
        <h1 id="loginTitle">ESP32 Radar</h1>
        <p class="lead">Sign in to follow detections and steer the radar.</p>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="username"
            required
          />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          />
        </div>
        <div id="loginError" role="alert"></div>
        <button class="btn btn-primary" id="loginBtn">Sign in</button>
      </section>

      <!-- Dashboard -->
      <section id="dashboard">
        <header class="topbar">
          <div class="title-block">
            <div class="brand-chip" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <circle cx="12" cy="12" r="6" />
                <circle cx="12" cy="12" r="2" />
              </svg>
            </div>
            <div>
              <h1>ESP32 Radar</h1>
              <span class="conn" id="connPill"
                ><span class="dot"></span
                ><span id="connText">Connecting…</span></span
              >
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-outline" id="logoutBtn">Log out</button>
          </div>
        </header>

        <div class="grid">
          <!-- Radar -->
          <section class="card radar-card" aria-label="Radar view">
            <div class="radar-wrap">
              <svg
                id="radarSvg"
                viewBox="0 0 400 240"
                role="img"
                aria-label="Radar showing the servo angle"
              >
                <defs>
                  <clipPath id="clipHalf">
                    <rect x="0" y="0" width="400" height="212" />
                  </clipPath>
                </defs>
                <g clip-path="url(#clipHalf)">
                  <circle class="ring" cx="200" cy="210" r="45" />
                  <circle class="ring" cx="200" cy="210" r="90" />
                  <circle class="ring" cx="200" cy="210" r="135" />
                  <circle class="ring" cx="200" cy="210" r="180" />
                  <line class="axis" x1="20" y1="210" x2="380" y2="210" />
                  <line class="axis" x1="200" y1="210" x2="200" y2="30" />
                  <line class="axis" x1="200" y1="210" x2="72.7" y2="82.7" />
                  <line class="axis" x1="200" y1="210" x2="327.3" y2="82.7" />
                  <g class="needle" id="needleG">
                    <path
                      class="wedge"
                      d="M200 210 L20 210 A180 180 0 0 0 36.9 286.1 Z"
                    />
                    <line
                      class="needle-line"
                      x1="200"
                      y1="210"
                      x2="20"
                      y2="210"
                    />
                  </g>
                  <g id="blip" hidden>
                    <circle class="blip-pulse" r="9" />
                    <circle class="blip-dot" r="6" />
                  </g>
                  <circle class="hub" cx="200" cy="210" r="7" />
                </g>
                <text class="svg-label" x="208" y="116" text-anchor="start">
                  5 cm
                </text>
                <text class="svg-label" x="208" y="26" text-anchor="start">
                  10 cm
                </text>
                <text class="svg-label" x="20" y="232">0°</text>
                <text class="svg-label" x="200" y="232">90°</text>
                <text class="svg-label" x="380" y="232">180°</text>
              </svg>
            </div>
            <div class="radar-foot">
              <div>
                <span class="k">Servo angle</span>
                <span id="angleReadout">0°</span>
              </div>
              <span class="mode-badge" id="modeBadge">Manual</span>
            </div>
          </section>

          <div class="side">
            <!-- Detection -->
            <section class="card detect" id="detectCard" aria-live="polite">
              <div class="detect-head">
                <span class="chip" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 1v4M12 19v4M1 12h4M19 12h4" />
                  </svg>
                </span>
                Detection
              </div>
              <div>
                <div class="detect-state" id="detectState">
                  Waiting for data…
                </div>
                <div class="distance" id="distanceBox" hidden>
                  <span id="distVal">0</span><span class="u">cm</span>
                </div>
                <p class="detect-sub" id="detectSub"></p>
              </div>
            </section>

            <!-- Indicators (read-only, follow /detect) -->
            <div class="indicators">
              <div class="ind" id="indGreen" style="--c: var(--green)">
                <div class="ind-top">
                  <svg class="icon" viewBox="0 0 24 24">
                    <path
                      d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1v.5h5V16c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"
                    />
                  </svg>
                  <span class="led"></span>
                </div>
                <div>
                  <span class="ind-name">Green LED</span
                  ><span class="ind-state" id="stGreen">…</span>
                </div>
              </div>
              <div class="ind" id="indRed" style="--c: var(--red)">
                <div class="ind-top">
                  <svg class="icon" viewBox="0 0 24 24">
                    <path
                      d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1v.5h5V16c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"
                    />
                  </svg>
                  <span class="led"></span>
                </div>
                <div>
                  <span class="ind-name">Red LED</span
                  ><span class="ind-state" id="stRed">…</span>
                </div>
              </div>
              <div class="ind buzzer" id="indBuzzer" style="--c: var(--amber)">
                <div class="ind-top">
                  <svg class="icon" viewBox="0 0 24 24">
                    <path d="M11 5 6 9H2v6h4l5 4V5z" />
                    <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" />
                  </svg>
                  <span class="led"></span>
                </div>
                <div>
                  <span class="ind-name">Buzzer</span
                  ><span class="ind-state" id="stBuzzer">…</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Controls -->
        <section class="card" aria-label="Controls">
          <div class="control-row">
            <div class="info">
              <span class="chip" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24">
                  <path d="M21 12a9 9 0 1 1-3-6.7" />
                  <path d="M21 4v5h-5" />
                </svg>
              </span>
              <div>
                <h2>Auto detect</h2>
                <p>The servo sweeps from 0° to 180° on its own.</p>
              </div>
            </div>
            <button
              class="switch"
              id="autoSwitch"
              role="switch"
              aria-checked="false"
              aria-label="Toggle auto detect"
              disabled
            ></button>
          </div>

          <div class="divider"></div>

          <div class="angle-block" id="angleBlock">
            <div class="angle-head">
              <h2>Manual angle</h2>
              <span class="val" id="angleVal">0°</span>
            </div>
            <p class="lock-note" id="lockNote" hidden>
              <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              Locked while Auto detect is on
            </p>
            <div class="range-wrap" id="rangeWrap">
              <output class="bubble" id="bubble">0°</output>
              <input
                type="range"
                id="angleRange"
                min="0"
                max="180"
                step="1"
                value="0"
                aria-label="Servo angle"
              />
            </div>
            <div class="ticks">
              <span>0°</span><span>90°</span><span>180°</span>
            </div>
            <div class="presets">
              <button class="preset" data-angle="0">0°</button>
              <button class="preset" data-angle="90">90°</button>
              <button class="preset" data-angle="180">180°</button>
            </div>
          </div>
        </section>
      </section>
    </main>


    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <script>
      // Firebase config: replace the YOUR_... values with the ones from
      // Firebase console > Project settings > Your apps > Web app
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "esp32-radar-926d9.firebaseapp.com",
        databaseURL: "https://esp32-radar-926d9-default-rtdb.firebaseio.com",
        projectId: "esp32-radar-926d9",
        storageBucket: "esp32-radar-926d9.firebasestorage.app",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID",
      };

      firebase.initializeApp(firebaseConfig);

      // Radar scale: the ESP32 detects objects closer than 10 cm
      const DETECT_RANGE_CM = 10;

      const loginForm = document.getElementById("loginForm");
      const dashboard = document.getElementById("dashboard");
      const loginBtn = document.getElementById("loginBtn");
      const loginError = document.getElementById("loginError");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      let listeners = []; // detached on logout

      function showError(msg) {
        loginError.textContent = msg;
      }

      function doLogin() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        showError("");

        if (!email || !password) {
          showError("Enter your email and password.");
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in…";

        // Firebase Auth checks the credentials (same user your ESP32 signs in with)
        firebase
          .auth()
          .signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            console.log("Signed in as", userCredential.user.email);
            loginForm.style.display = "none";
            dashboard.style.display = "block";
            startRadar();
          })
          .catch(() => {
            showError("Email or password is incorrect.");
          })
          .finally(() => {
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign in";
          });
      }

      loginBtn.addEventListener("click", doLogin);
      [emailInput, passwordInput].forEach((el) =>
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") doLogin();
        }),
      );

      function startRadar() {
        const db = firebase.database();

        const $ = (id) => document.getElementById(id);
        const el = {
          connPill: $("connPill"),
          connText: $("connText"),
          needle: $("needleG"),
          blip: $("blip"),
          svg: $("radarSvg"),
          angleReadout: $("angleReadout"),
          modeBadge: $("modeBadge"),
          detectCard: $("detectCard"),
          detectState: $("detectState"),
          distanceBox: $("distanceBox"),
          distVal: $("distVal"),
          detectSub: $("detectSub"),
          indGreen: $("indGreen"),
          indRed: $("indRed"),
          indBuzzer: $("indBuzzer"),
          stGreen: $("stGreen"),
          stRed: $("stRed"),
          stBuzzer: $("stBuzzer"),
          autoSwitch: $("autoSwitch"),
          angleBlock: $("angleBlock"),
          lockNote: $("lockNote"),
          angleVal: $("angleVal"),
          rangeWrap: $("rangeWrap"),
          bubble: $("bubble"),
          range: $("angleRange"),
          presets: document.querySelectorAll(".preset"),
        };

        // Firebase paths used by the ESP32: /auto /angle /detect /distance
        const refs = {
          auto: db.ref("/auto"),
          angle: db.ref("/angle"),
          detect: db.ref("/detect"),
          distance: db.ref("/distance"),
        };

        const state = {
          auto: false,
          autoLoaded: false,
          detect: false,
          detectLoaded: false,
          distance: null,
          angle: 0,
        };
        let dragging = false;

        function clampAngle(v) {
          v = parseInt(v, 10);
          if (isNaN(v)) return 0;
          return Math.max(0, Math.min(180, v));
        }

        // Distance as a whole number (4.57 becomes 4). Use Math.round for nearest.
        function formatDistance(d) {
          const n = Math.floor(d);
          return n < 1 ? "<1" : String(n);
        }

        function render() {
          const { auto, detect } = state;
          const angle = state.angle;

          // Mode
          el.autoSwitch.setAttribute("aria-checked", String(auto));
          el.autoSwitch.disabled = !state.autoLoaded;
          el.modeBadge.textContent = auto ? "Auto scan" : "Manual";
          el.modeBadge.classList.toggle("auto", auto);

          // Needle: sweeps by itself in auto mode, otherwise follows /angle
          el.needle.classList.toggle("scanning", auto);
          el.needle.style.transform = auto ? "" : `rotate(${angle}deg)`;
          el.angleReadout.textContent = auto ? "Scanning" : angle + "°";

          // Detection
          const hasDist =
            detect && state.distance !== null && !isNaN(state.distance);
          el.svg.classList.toggle("alert", detect);
          el.detectCard.classList.toggle("alert", state.detectLoaded && detect);
          el.detectCard.classList.toggle(
            "clear",
            state.detectLoaded && !detect,
          );

          if (!state.detectLoaded) {
            el.detectState.textContent = "Waiting for data…";
            el.distanceBox.hidden = true;
            el.detectSub.textContent = "";
          } else if (detect) {
            el.detectState.textContent = "Object detected";
            el.distanceBox.hidden = !hasDist;
            el.detectState.hidden = false;
            if (hasDist)
              el.distVal.textContent = formatDistance(state.distance);
            el.detectSub.textContent = hasDist ? "away from the sensor" : "";
          } else {
            el.detectState.textContent = "All clear";
            el.distanceBox.hidden = true;
            el.detectSub.textContent = "No object within range";
          }

          // Blip on the radar (only when the angle is known, i.e. manual mode)
          if (detect && hasDist && !auto) {
            const r = Math.max(
              24,
              Math.min(1, state.distance / DETECT_RANGE_CM) * 180,
            );
            const rad = (angle * Math.PI) / 180;
            const x = 200 - r * Math.cos(rad);
            const y = 210 - r * Math.sin(rad);
            el.blip.setAttribute(
              "transform",
              `translate(${x.toFixed(1)} ${y.toFixed(1)})`,
            );
            el.blip.hidden = false;
          } else {
            el.blip.hidden = true;
          }

          // Indicators: red LED + buzzer on when detect is true, green LED when false
          const L = state.detectLoaded;
          el.indGreen.classList.toggle("on", L && !detect);
          el.indRed.classList.toggle("on", L && detect);
          el.indBuzzer.classList.toggle("on", L && detect);
          el.stGreen.textContent = L ? (!detect ? "On" : "Off") : "…";
          el.stRed.textContent = L ? (detect ? "On" : "Off") : "…";
          el.stBuzzer.textContent = L ? (detect ? "Sounding" : "Off") : "…";

          // Angle controls (locked in auto mode)
          el.angleBlock.classList.toggle("locked", auto);
          el.lockNote.hidden = !auto;
          el.range.disabled = auto;
          el.presets.forEach((b) => {
            b.disabled = auto;
            b.classList.toggle(
              "active",
              !auto && parseInt(b.dataset.angle, 10) === angle,
            );
          });
          el.angleVal.textContent = angle + "°";
          el.bubble.textContent = angle + "°";
          el.rangeWrap.style.setProperty("--pn", (angle / 180) * 100);
          if (!dragging) el.range.value = angle;
        }

        function listen(ref, fn) {
          const handler = ref.on("value", fn);
          listeners.push({ ref, handler });
        }

        // Connection indicator
        listen(db.ref(".info/connected"), (snap) => {
          const online = snap.val() === true;
          el.connPill.classList.toggle("online", online);
          el.connText.textContent = online ? "Connected" : "Offline";
        });

        listen(refs.auto, (snap) => {
          state.auto = !!snap.val();
          state.autoLoaded = true;
          render();
        });
        listen(refs.detect, (snap) => {
          state.detect = !!snap.val();
          state.detectLoaded = true;
          render();
        });
        listen(refs.distance, (snap) => {
          const n = parseFloat(snap.val());
          state.distance = isNaN(n) ? null : n;
          render();
        });
        listen(refs.angle, (snap) => {
          if (!dragging) {
            state.angle = clampAngle(snap.val());
            render();
          }
        });

        // Auto detect toggle
        el.autoSwitch.onclick = () => {
          refs.auto.set(!state.auto);
        };

        // Slider: preview while dragging, send once on release
        el.range.addEventListener("input", () => {
          dragging = true;
          state.angle = clampAngle(el.range.value);
          render();
        });
        el.range.addEventListener("change", () => {
          dragging = false;
          state.angle = clampAngle(el.range.value);
          render();
          if (!state.auto) refs.angle.set(state.angle);
        });

        // Preset buttons: 0, 90, 180
        el.presets.forEach((btn) => {
          btn.onclick = () => {
            if (state.auto) return;
            state.angle = clampAngle(btn.dataset.angle);
            render();
            refs.angle.set(state.angle);
          };
        });
      }

      document.getElementById("logoutBtn").onclick = () => {
        firebase
          .auth()
          .signOut()
          .then(() => {
            listeners.forEach((l) => l.ref.off("value", l.handler));
            listeners = [];
            dashboard.style.display = "none";
            loginForm.style.display = "block";
            emailInput.value = "";
            passwordInput.value = "";
            showError("");
          })
          .catch((error) => {
            alert("Logout failed: " + error.message);
          });
      };
    </script>
  </body>
</html>
