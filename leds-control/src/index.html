<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ESP32 LED Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #12151a;
      --panel: #1a1e25;
      --panel-raised: #222731;
      --line: #2c323d;
      --text: #eceff4;
      --muted: #8d97a8;
      --danger: #ff5d5d;
      --ok: #4cd4a0;
      --blue: #5aa2ff;
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 20px 24px;
    }

    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

    /* ---------- Login ---------- */
    #loginForm {
      max-width: 400px;
      margin: 12vh auto 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 36px 28px 28px;
    }
    #loginForm h1 { margin: 0 0 6px; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; }
    #loginForm .lead { margin: 0 0 28px; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .field input {
      width: 100%;
      padding: 14px 16px;
      font: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .field input::placeholder { color: #566074; }
    .field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(90, 162, 255, 0.18); }
    #loginError { min-height: 1.3em; margin: -4px 0 14px; font-size: 0.88rem; color: var(--danger); }

    .btn {
      font: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: var(--radius-md);
      padding: 13px 20px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { width: 100%; background: var(--blue); color: #0b1220; font-size: 1rem; }
    .btn-primary:hover { background: #7bb6ff; }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }
    .btn-ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
    .btn-ghost:hover { background: var(--panel-raised); }
    .btn-danger { background: rgba(255, 93, 93, 0.12); color: var(--danger); border: 1.5px solid rgba(255, 93, 93, 0.35); }
    .btn-danger:hover { background: rgba(255, 93, 93, 0.2); }

    /* ---------- Dashboard ---------- */
    #dashboard { display: none; }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
    }
    .topbar h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -0.03em; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
    }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .pill.online .dot { background: var(--ok); }
    .pill.online { color: var(--text); }
    .pill strong { color: var(--text); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .led-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    /* Each card carries its own LED color through --c */
    .led-card {
      --c: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 190px;
      padding: 22px;
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      transition: border-color 0.3s ease, background-color 0.3s ease;
    }
    .led-card.on {
      border-color: color-mix(in srgb, var(--c) 60%, transparent);
      background: linear-gradient(180deg, color-mix(in srgb, var(--c) 14%, transparent), var(--panel) 70%);
    }

    .card-head { display: flex; align-items: center; justify-content: space-between; }
    .led-card h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
    .led {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--c) 22%, #2a303a);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .led-card.on .led {
      background: var(--c);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent), 0 0 16px var(--c);
    }

    .card-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .card-status { margin: 0; font-size: 0.85rem; color: var(--muted); }
    .card-status span {
      display: block;
      margin-top: 2px;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .led-card.on .card-status span { color: var(--c); }

    /* Toggle switch */
    .switch {
      position: relative;
      flex-shrink: 0;
      width: 64px;
      height: 36px;
      padding: 0;
      border: none;
      border-radius: var(--radius-pill);
      background: #333a47;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.3s cubic-bezier(.3, 1.4, .5, 1);
    }
    .switch[aria-checked="true"] { background: var(--c); }
    .switch[aria-checked="true"]::after { transform: translateX(28px); }
    .switch:disabled { opacity: 0.5; cursor: not-allowed; }

    footer { padding: 20px; text-align: center; font-size: 0.85rem; color: var(--muted); }

    @media (max-width: 560px) {
      main { padding-top: 24px; }
      #loginForm { margin-top: 6vh; padding: 28px 20px 22px; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; }
      .led-container { grid-template-columns: 1fr; gap: 12px; }
      .led-card { min-height: 150px; padding: 18px; }
    }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <main>
    <!-- Login form -->
    <section id="loginForm" aria-labelledby="loginTitle">
      <h1 id="loginTitle">LED control</h1>
      <p class="lead">Sign in to switch the LEDs connected to your ESP32.</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required />
      </div>
      <div id="loginError" role="alert"></div>
      <button class="btn btn-primary" id="loginBtn">Sign in</button>
    </section>

    <!-- Dashboard -->
    <section id="dashboard">
      <header class="topbar">
        <div>
          <h1>LED control</h1>
          <div class="meta">
            <span class="pill" id="connPill"><span class="dot"></span><span id="connText">Connecting…</span></span>
            <span class="pill"><strong id="onCount">0</strong> of 3 on</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-danger" id="allOffBtn">Turn all off</button>
          <button class="btn btn-ghost" id="logoutBtn">Log out</button>
        </div>
      </header>

      <div class="led-container">
        <article class="led-card" id="card1" style="--c: #3ddc84">
          <div class="card-head"><h2>Green LED</h2><span class="led"></span></div>
          <div class="card-foot">
            <p class="card-status">Status<span id="status1">Loading…</span></p>
            <button class="switch" id="btn1" role="switch" aria-checked="false" aria-label="Toggle green LED" disabled></button>
          </div>
        </article>

        <article class="led-card" id="card2" style="--c: #ffd43b">
          <div class="card-head"><h2>Yellow LED</h2><span class="led"></span></div>
          <div class="card-foot">
            <p class="card-status">Status<span id="status2">Loading…</span></p>
            <button class="switch" id="btn2" role="switch" aria-checked="false" aria-label="Toggle yellow LED" disabled></button>
          </div>
        </article>

        <article class="led-card" id="card3" style="--c: #ff5d5d">
          <div class="card-head"><h2>Red LED</h2><span class="led"></span></div>
          <div class="card-foot">
            <p class="card-status">Status<span id="status3">Loading…</span></p>
            <button class="switch" id="btn3" role="switch" aria-checked="false" aria-label="Toggle red LED" disabled></button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer>Created by Tech StudyCell</footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script>
    // Firebase config: replace the YOUR_... values with the ones from
    // Firebase console > Project settings > Your apps > Web app
    // Firebase config
      const firebaseConfig = {
        apiKey: "",
        authDomain: "",
        databaseURL: "",
        projectId: "",
        storageBucket: "",
        messagingSenderId: "",
        appId: "",
      };


    firebase.initializeApp(firebaseConfig);

    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    let listeners = []; // detached on logout

    function showError(msg) { loginError.textContent = msg; }

    function doLogin() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      showError("");

      if (!email || !password) {
        showError("Enter your email and password.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in…";

      // Firebase Auth checks the credentials (same user your ESP32 signs in with)
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          console.log("Signed in as", userCredential.user.email);
          loginForm.style.display = "none";
          dashboard.style.display = "block";
          startLedControl();
        })
        .catch(() => {
          showError("Email or password is incorrect.");
        })
        .finally(() => {
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign in";
        });
    }

    loginBtn.addEventListener("click", doLogin);
    [emailInput, passwordInput].forEach(el =>
      el.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); })
    );

    function startLedControl() {
      const db = firebase.database();
      const onCount = document.getElementById("onCount");
      const connPill = document.getElementById("connPill");
      const connText = document.getElementById("connText");

      // Paths match the ESP32 code: /led1 (green), /led2 (yellow), /led3 (red)
      const leds = [
        { id: 1, path: "led1" },
        { id: 2, path: "led2" },
        { id: 3, path: "led3" },
      ];

      const states = {};

      function updateCount() {
        onCount.textContent = Object.values(states).filter(Boolean).length;
      }

      // Connection indicator
      const connRef = db.ref(".info/connected");
      const connHandler = connRef.on("value", snap => {
        const online = snap.val() === true;
        connPill.classList.toggle("online", online);
        connText.textContent = online ? "Connected" : "Offline";
      });
      listeners.push({ ref: connRef, handler: connHandler });

      leds.forEach(led => {
        const card = document.getElementById(`card${led.id}`);
        const statusText = document.getElementById(`status${led.id}`);
        const toggleButton = document.getElementById(`btn${led.id}`);
        const ledRef = db.ref("/" + led.path);

        const handler = ledRef.on("value", (snapshot) => {
          const state = !!snapshot.val();
          states[led.id] = state;
          statusText.innerText = state ? "On" : "Off";
          card.classList.toggle("on", state);
          toggleButton.setAttribute("aria-checked", String(state));
          toggleButton.disabled = false;
          updateCount();
        });
        listeners.push({ ref: ledRef, handler });

        toggleButton.onclick = () => {
          ledRef.get().then(snap => {
            ledRef.set(!snap.val());
          });
        };
      });

      document.getElementById("allOffBtn").onclick = () => {
        leds.forEach(led => {
          db.ref("/" + led.path).set(false);
        });
      };
    }

    document.getElementById("logoutBtn").onclick = () => {
      firebase.auth().signOut()
        .then(() => {
          listeners.forEach(l => l.ref.off("value", l.handler));
          listeners = [];
          dashboard.style.display = "none";
          loginForm.style.display = "block";
          emailInput.value = "";
          passwordInput.value = "";
          showError("");
        })
        .catch(error => {
          alert("Logout failed: " + error.message);
        });
    };
  </script>
</body>
</html>
